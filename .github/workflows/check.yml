name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v

  manifests:
    name: plugin and marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin
        env:
          DISABLE_AUTOUPDATER: "1"
        run: claude plugin validate --strict plugins/hiring-panel
      - name: Validate the marketplace
        env:
          DISABLE_AUTOUPDATER: "1"
        run: claude plugin validate --strict .

  no-network:
    name: no network access from shipped code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static scan and socket-blocked doctor run
        run: bash scripts/check.sh --no-tests --no-validate

  release:
    name: build and attach release files
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, manifests, no-network]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Check the tag matches the plugin version
        run: |
          version="$(python -c 'import json; print(json.load(open("plugins/hiring-panel/.claude-plugin/plugin.json"))["version"])')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin.json version $version" >&2
            exit 1
          fi
      - name: Build the release files
        env:
          DISABLE_AUTOUPDATER: "1"
        run: bash scripts/release.sh
      - name: Write release notes from the changelog
        run: |
          python - "$GITHUB_REF_NAME" <<'EOF'
          import re, sys
          version = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          body = match.group(1).strip() if match else "See CHANGELOG.md."
          body += "\n\nInstall: see the README. Download `hiring-panel.plugin` (claude.ai Upload plugin) or `hiring-panel-skill.zip` (Customize > Skills)."
          open("release-notes.md", "w", encoding="utf-8").write(body + "\n")
          EOF
      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/hiring-panel.plugin dist/hiring-panel-skill.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/hiring-panel.plugin dist/hiring-panel-skill.zip \
              --title "Hiring Panel $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
